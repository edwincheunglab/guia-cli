[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "guia-cli"
version = "0.1.0"
description = "A local command-line interface for GUIA biomedical research agents."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "google-adk>=1.27,<2",
    "httpx>=0.28,<1",
    "litellm>=1.82,<2",
    "openpyxl>=3.1,<4",
    "python-dotenv>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[project.scripts]
guia = "guia_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
